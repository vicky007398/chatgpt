<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">KosRent rental rooms poster</title>
  <desc id="desc">Poster advertising KosRent for rental rooms and flats in Kosamba.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8f3"/>
      <stop offset="0.58" stop-color="#e9f0e4"/>
      <stop offset="1" stop-color="#dfe9d8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5c45"/>
      <stop offset="1" stop-color="#102f28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#123b32" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="928" cy="120" r="220" fill="#d6e2cc" opacity="0.8"/>
  <circle cx="90" cy="1210" r="250" fill="#fff8df" opacity="0.85"/>

  <g transform="translate(82 80)">
    <rect x="0" y="0" width="916" height="1190" rx="52" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="36" y="36" width="844" height="1118" rx="40" fill="none" stroke="#dce7d6" stroke-width="3"/>

    <g transform="translate(78 86)">
      <rect x="0" y="0" width="86" height="86" rx="24" fill="url(#green)"/>
      <path d="M24 56V36L43 21L62 36V56H51V43H35V56Z" fill="#ffffff"/>
      <text x="110" y="37" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="800" fill="#123b32">KosRent</text>
      <text x="113" y="68" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#6f806a">Only for Kosamba</text>
    </g>

    <text x="78" y="300" font-family="DM Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#123b32">Find rent rooms</text>
    <text x="78" y="385" font-family="DM Sans, Arial, sans-serif" font-size="78" font-weight="800" fill="#123b32">in Kosamba</text>
    <text x="82" y="445" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="600" fill="#667762">1BHK . 2BHK . 3BHK rental homes</text>

    <g transform="translate(78 510)">
      <rect x="0" y="0" width="760" height="150" rx="34" fill="#123b32"/>
      <text x="44" y="61" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Install app</text>
      <text x="44" y="105" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="500" fill="#d7e6dc">Search homes, call owners, save listings</text>
      <circle cx="677" cy="75" r="42" fill="#f4d48d"/>
      <path d="M660 76H692M678 60L694 76L678 92" fill="none" stroke="#123b32" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(78 720)">
      <rect x="0" y="0" width="360" height="360" rx="34" fill="#f6f8f3" stroke="#d7e3d0" stroke-width="3"/>
      <image x="38" y="38" width="284" height="284" href="https://api.qrserver.com/v1/create-qr-code/?size=284x284&amp;margin=12&amp;data=https%3A%2F%2Fkosrent.up.railway.app"/>
      <text x="180" y="404" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#123b32">Scan to open</text>
    </g>

    <g transform="translate(500 735)">
      <text x="0" y="0" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#123b32">For renters</text>
      <text x="0" y="44" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#667762">Find available homes fast.</text>
      <text x="0" y="107" font-family="DM Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#123b32">For owners</text>
      <text x="0" y="151" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#667762">List your rental home free.</text>
      <rect x="0" y="210" width="330" height="76" rx="22" fill="#e8f2e6"/>
      <text x="165" y="258" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="27" font-weight="800" fill="#123b32">kosrent.up.railway.app</text>
    </g>

    <text x="540" y="1130" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#123b32">Find rent rooms in Kosamba | KosRent | Install app</text>
  </g>
</svg>
