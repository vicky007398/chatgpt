<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">KosRent owner listing poster</title>
  <desc id="desc">Poster encouraging homeowners in Kosamba to list rental homes on KosRent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b32"/>
      <stop offset="1" stop-color="#22624a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="930" cy="146" r="230" fill="#f4d48d" opacity="0.22"/>
  <circle cx="118" cy="1160" r="260" fill="#ffffff" opacity="0.08"/>

  <g transform="translate(78 80)">
    <rect width="924" height="1190" rx="54" fill="#ffffff" filter="url(#shadow)"/>
    <g transform="translate(72 72)">
      <rect width="78" height="78" rx="22" fill="#123b32"/>
      <path d="M22 50V34L39 20L56 34V50H47V39H31V50Z" fill="#fff"/>
      <text x="102" y="36" font-family="DM Sans, Arial, sans-serif" font-size="48" font-weight="900" fill="#123b32">KosRent</text>
      <text x="105" y="66" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#6a7c65">For house owners in Kosamba</text>
    </g>

    <text x="72" y="270" font-family="DM Sans, Arial, sans-serif" font-size="76" font-weight="900" fill="#123b32">Have a house</text>
    <text x="72" y="350" font-family="DM Sans, Arial, sans-serif" font-size="76" font-weight="900" fill="#123b32">for rent?</text>
    <text x="76" y="412" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#65755f">Post it on KosRent and let renters call you directly.</text>

    <g transform="translate(72 492)">
      <rect width="780" height="118" rx="26" fill="#e8f2e6"/>
      <text x="42" y="47" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="900" fill="#123b32">Add owner name, locality, rent and deposit</text>
      <text x="42" y="82" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#61725d">Photos optional . Sq ft optional . Description optional</text>
    </g>
    <g transform="translate(72 642)">
      <rect width="780" height="118" rx="26" fill="#fff3d6"/>
      <text x="42" y="47" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="900" fill="#123b32">Your mobile number is visible on the post</text>
      <text x="42" y="82" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#61725d">Renters can tap and call directly from the app</text>
    </g>
    <g transform="translate(72 792)">
      <rect width="780" height="118" rx="26" fill="#edf3f1"/>
      <text x="42" y="47" font-family="DM Sans, Arial, sans-serif" font-size="30" font-weight="900" fill="#123b32">Free launch period</text>
      <text x="42" y="82" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#61725d">List now and help people find rooms in Kosamba</text>
    </g>

    <g transform="translate(72 982)">
      <rect width="780" height="132" rx="32" fill="#123b32"/>
      <text x="390" y="53" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="35" font-weight="900" fill="#fff">Open KosRent</text>
      <text x="390" y="93" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="26" font-weight="900" fill="#f4d48d">kosrent.up.railway.app</text>
    </g>
  </g>
</svg>
