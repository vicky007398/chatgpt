          <text x="120" y="36" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="900" fill="#153e34">1 BHK in Jalaram Chowk</text>
          <text x="120" y="59" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#60725c">Rs 5,200/mo . Deposit Rs 10,000</text>
