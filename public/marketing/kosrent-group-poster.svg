<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">KosRent group sharing poster</title>
  <desc id="desc">Promotional poster with app preview and sample rental listings for KosRent in Kosamba.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf4"/>
      <stop offset="0.55" stop-color="#e9f2e6"/>
      <stop offset="1" stop-color="#fff3d6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d5c43"/>
      <stop offset="1" stop-color="#0d3028"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#102f28" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="930" cy="112" r="190" fill="#d6e5cd"/>
  <circle cx="124" cy="1248" r="235" fill="#f5dfa7"/>

