<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KosRent Marketing Pack</title>
  <style>
    body{margin:0;font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f8f3;color:#123b32;padding:22px}
    main{max-width:960px;margin:auto}
    h1{font-size:34px;line-height:1.1;margin:10px 0}
    p{color:#647562;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:24px 0}
    a.card{display:block;background:#fff;border:1px solid #dce8d4;border-radius:18px;padding:14px;color:inherit;text-decoration:none;box-shadow:0 8px 24px #123b3210}
    img{width:100%;display:block;border-radius:12px;background:#fff}
    strong{display:block;margin-top:12px;font-size:18px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;padding:0 16px;background:#123b32;color:#fff;text-decoration:none;font-weight:800;margin:8px 8px 8px 0}
  </style>
</head>
<body>
  <main>
    <h1>KosRent Marketing Pack</h1>
    <p>Use these posters and messages in Kosamba WhatsApp groups, society groups, shop groups and owner/renter contacts.</p>
    <div class="grid">
      <a class="card" href="/marketing/kosrent-group-poster.svg">
        <img src="/marketing/kosrent-group-poster.svg" alt="KosRent group poster">
        <strong>Group poster with app preview</strong>
      </a>
      <a class="card" href="/marketing/kosrent-owner-poster.svg">
        <img src="/marketing/kosrent-owner-poster.svg" alt="KosRent owner poster">
        <strong>Owner listing poster</strong>
      </a>
    </div>
    <a class="button" href="/marketing/group-messages.md">Open group messages</a>
    <a class="button" href="/">Open KosRent</a>
  </main>
</body>
</html>
